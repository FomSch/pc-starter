<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Temperature Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            border-left: 4px solid #667eea;
        }
        
        .status-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .temp-critical { border-left-color: #e74c3c; }
        .temp-hot { border-left-color: #f39c12; }
        .temp-warm { border-left-color: #f1c40f; }
        .temp-normal { border-left-color: #2ecc71; }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .btn.active {
            background: #2ecc71;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .stats-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .controls {
                justify-content: stretch;
            }
            
            .btn {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Pi Temperature Dashboard</h1>
            <p>Real-time monitoring and historical data</p>
        </div>
        
        <div class="status-grid">
            <div class="status-card" id="currentTemp">
                <h3>Current Temperature</h3>
                <div class="status-value">--°C</div>
            </div>
            <div class="status-card">
                <h3>CPU Load</h3>
                <div class="status-value" id="cpuLoad">--%</div>
            </div>
            <div class="status-card">
                <h3>Memory Usage</h3>
                <div class="status-value" id="memUsage">--%</div>
            </div>
            <div class="status-card">
                <h3>Status</h3>
                <div class="status-value" id="systemStatus">--</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary active" onclick="loadData(1)">1 Hour</button>
            <button class="btn btn-primary" onclick="loadData(6)">6 Hours</button>
            <button class="btn btn-primary" onclick="loadData(24)">24 Hours</button>
            <button class="btn btn-primary" onclick="loadData(168)">7 Days</button>
            <button class="btn btn-primary" onclick="loadData(720)">30 Days</button>
            <button class="btn btn-secondary" onclick="exportData()">Export CSV</button>
        </div>
        
        <div class="controls" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 15px;">
            <h4 style="text-align: center; margin-bottom: 10px; color: #666;">Server Control</h4>
            <button class="btn btn-secondary" onclick="getServerStatus()">🔍 Status</button>
            <button class="btn" style="background: #e74c3c; color: white;" onclick="restartServer()">🔄 Restart Bot</button>
        </div>
        
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
        
        <div class="stats-container">
            <h3 style="margin-bottom: 20px; text-align: center;">Statistics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Min Temperature</div>
                    <div class="stat-value" id="minTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Max Temperature</div>
                    <div class="stat-value" id="maxTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Average Temperature</div>
                    <div class="stat-value" id="avgTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Data Points</div>
                    <div class="stat-value" id="dataCount">--</div>
                </div>
            </div>
        </div>
        
        <div class="last-update" id="lastUpdate">
            Last updated: --
        </div>
    </div>

    <script>
        const socket = io();
        let chart;
        let currentHours = 1;
        
        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('temperatureChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }
        
        // Load temperature data
        async function loadData(hours) {
            currentHours = hours;
            
            // Update active button
            document.querySelectorAll('.btn-primary').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            try {
                const response = await fetch(`/api/temperature/${hours}`);
                const data = await response.json();
                
                const labels = data.map(item => {
                    const date = new Date(item.timestamp);
                    return hours <= 24 ? 
                        date.toLocaleTimeString() : 
                        date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                });
                
                const temperatures = data.map(item => item.temperature);
                
                chart.data.labels = labels;
                chart.data.datasets[0].data = temperatures;
                chart.update();
                
                // Load stats
                loadStats(hours);
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        // Load statistics
        async function loadStats(hours) {
            try {
                const response = await fetch(`/api/stats/${hours}`);
                const stats = await response.json();
                
                document.getElementById('minTemp').textContent = stats.min_temp ? stats.min_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('maxTemp').textContent = stats.max_temp ? stats.max_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('avgTemp').textContent = stats.avg_temp ? stats.avg_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('dataCount').textContent = stats.count || '--';
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load current data
        async function loadCurrentData() {
            try {
                const response = await fetch('/api/current');
                const data = await response.json();
                
                updateCurrentDisplay(data);
                
            } catch (error) {
                console.error('Error loading current data:', error);
            }
        }
        
        // Update current display
        function updateCurrentDisplay(data) {
            const tempCard = document.getElementById('currentTemp');
            const tempValue = tempCard.querySelector('.status-value');
            
            if (data.temperature !== null) {
                tempValue.textContent = data.temperature.toFixed(1) + '°C ' + data.emoji;
                
                // Update card color based on temperature
                tempCard.className = 'status-card';
                if (data.temperature >= 80) tempCard.classList.add('temp-critical');
                else if (data.temperature >= 70) tempCard.classList.add('temp-hot');
                else if (data.temperature >= 60) tempCard.classList.add('temp-warm');
                else tempCard.classList.add('temp-normal');
            } else {
                tempValue.textContent = 'N/A';
            }
            
            // Update system stats
            if (data.systemStats) {
                document.getElementById('cpuLoad').textContent = 
                    data.systemStats.cpuLoad !== undefined ? data.systemStats.cpuLoad + '%' : '--%';
                document.getElementById('memUsage').textContent = 
                    data.systemStats.memUsage !== undefined ? data.systemStats.memUsage + '%' : '--%';
            }
            
            document.getElementById('systemStatus').textContent = data.status || '--';
            document.getElementById('lastUpdate').textContent = 
                'Last updated: ' + new Date(data.timestamp).toLocaleString();
        }
        
        // Export data
        function exportData() {
            window.open(`/api/export/${currentHours}`, '_blank');
        }
        
        // Server control functions
        async function getServerStatus() {
            try {
                const response = await fetch('/api/server/status');
                const status = await response.json();
                
                const uptimeHours = Math.floor(status.uptime / 3600);
                const uptimeMinutes = Math.floor((status.uptime % 3600) / 60);
                const memoryMB = Math.round(status.memory.rss / 1024 / 1024);
                
                alert(`🖥️ Server Status:\n\n` +
                      `Status: ${status.status}\n` +
                      `Uptime: ${uptimeHours}h ${uptimeMinutes}m\n` +
                      `Memory: ${memoryMB} MB\n` +
                      `Process ID: ${status.pid}`);
            } catch (error) {
                alert('❌ Error getting server status: ' + error.message);
            }
        }
        
        async function restartServer() {
            if (!confirm('🔄 Are you sure you want to restart the Discord bot?\n\nThis will temporarily disconnect the bot from Discord.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/server/restart', {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('✅ Bot restart initiated!\n\nThe bot will restart in a few seconds. If you\'re using systemd, it will automatically restart.');
                } else {
                    alert('❌ Error restarting server: ' + result.message);
                }
            } catch (error) {
                alert('❌ Error restarting server: ' + error.message);
            }
        }
        
        // Socket events
        socket.on('temperatureUpdate', (data) => {
            updateCurrentDisplay(data);
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadCurrentData();
            loadData(1);
            
            // Auto-refresh current data every 30 seconds
            setInterval(loadCurrentData, 30000);
        });
    </script>
</body>
</html>
