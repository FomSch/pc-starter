<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Control Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #0d2847 50%, #1e3a5f 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(30, 136, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(66, 165, 245, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(41, 182, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: aurora 20s ease-in-out infinite;
        }

        @keyframes aurora {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #64b5f6 50%, #42a5f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(66, 165, 245, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }

        .header p {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        .card {
            background: rgba(30, 136, 229, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(66, 165, 245, 0.2);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(66, 165, 245, 0.5), transparent);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
            border-color: rgba(66, 165, 245, 0.3);
        }

        .card h2 {
            font-size: 1.8em;
            margin-bottom: 24px;
            color: #64b5f6;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e88e5, #1976d2);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 136, 229, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 160, 71, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e53935, #c62828);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 57, 53, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fb8c00, #ef6c00);
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 140, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-loading {
            position: relative;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .ip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .service-item {
            background: rgba(30, 136, 229, 0.1);
            border: 1px solid rgba(66, 165, 245, 0.2);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .service-item:hover {
            background: rgba(30, 136, 229, 0.15);
            border-color: rgba(66, 165, 245, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.2);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .service-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #64b5f6;
            margin-bottom: 4px;
        }

        .service-location {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(66, 165, 245, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .service-description {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        .service-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .service-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .service-detail-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .service-detail-value {
            color: #64b5f6;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .service-url {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(66, 165, 245, 0.2);
        }

        .service-url-btn {
            width: 100%;
            padding: 10px;
            background: rgba(66, 165, 245, 0.2);
            border: 1px solid rgba(66, 165, 245, 0.3);
            border-radius: 8px;
            color: #64b5f6;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .service-url-btn:hover {
            background: rgba(66, 165, 245, 0.3);
            border-color: rgba(66, 165, 245, 0.5);
            transform: translateY(-1px);
        }

        .loading-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px;
            font-size: 1.1em;
        }

        .ip-item {
            background: rgba(30, 136, 229, 0.1);
            border: 1px solid rgba(66, 165, 245, 0.2);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .ip-item:hover {
            background: rgba(30, 136, 229, 0.15);
            border-color: rgba(66, 165, 245, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.2);
        }

        .ip-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .ip-address {
            font-size: 1.3em;
            font-weight: 600;
            color: #64b5f6;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(66, 165, 245, 0.2);
            border: 1px solid rgba(66, 165, 245, 0.3);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            color: #64b5f6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: rgba(66, 165, 245, 0.3);
            border-color: rgba(66, 165, 245, 0.5);
        }

        .copy-btn.copied {
            background: rgba(67, 160, 71, 0.3);
            border-color: rgba(67, 160, 71, 0.5);
            color: #81c784;
        }

        .ip-item-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .ip-action-btn {
            background: rgba(66, 165, 245, 0.2);
            border: 1px solid rgba(66, 165, 245, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75em;
            color: #64b5f6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ip-action-btn:hover {
            background: rgba(66, 165, 245, 0.3);
            border-color: rgba(66, 165, 245, 0.5);
        }

        .ip-action-btn.delete {
            background: rgba(229, 57, 53, 0.2);
            border-color: rgba(229, 57, 53, 0.3);
            color: #ef5350;
        }

        .ip-action-btn.delete:hover {
            background: rgba(229, 57, 53, 0.3);
            border-color: rgba(229, 57, 53, 0.5);
        }

        .ip-item.editing {
            border-color: rgba(66, 165, 245, 0.5);
            background: rgba(30, 136, 229, 0.15);
        }

        .ip-item input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(66, 165, 245, 0.3);
            border-radius: 8px;
            padding: 8px;
            color: #ffffff;
            font-size: 0.9em;
            width: 100%;
            margin-bottom: 8px;
        }

        .ip-item input:focus {
            outline: none;
            border-color: rgba(66, 165, 245, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        .ip-item input.ip-input {
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            font-weight: 600;
        }

        .add-ip-btn {
            background: rgba(67, 160, 71, 0.2);
            border: 2px dashed rgba(67, 160, 71, 0.4);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
        }

        .add-ip-btn:hover {
            background: rgba(67, 160, 71, 0.3);
            border-color: rgba(67, 160, 71, 0.6);
            color: #81c784;
        }

        .ip-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .save-ip-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-ip-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.3);
        }

        .save-ip-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding: 8px 0;
        }

        .collapsible-header:hover {
            opacity: 0.8;
        }

        .collapse-icon {
            transition: transform 0.3s ease;
            font-size: 1.2em;
        }

        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }

        .collapsible-content {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .collapsible-content.collapsed {
            max-height: 0;
            opacity: 0;
            padding: 0;
        }

        .website-item {
            background: rgba(30, 136, 229, 0.1);
            border: 1px solid rgba(66, 165, 245, 0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .website-item:hover {
            background: rgba(30, 136, 229, 0.15);
            border-color: rgba(66, 165, 245, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.2);
        }

        .website-item-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .website-link {
            display: block;
            text-decoration: none;
            color: #64b5f6;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .website-link:hover {
            text-decoration: underline;
        }

        .website-description {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        .website-item.editing {
            border-color: rgba(66, 165, 245, 0.5);
            background: rgba(30, 136, 229, 0.15);
        }

        .website-item input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(66, 165, 245, 0.3);
            border-radius: 8px;
            padding: 8px;
            color: #ffffff;
            font-size: 0.9em;
            width: 100%;
            margin-bottom: 8px;
        }

        .website-item input:focus {
            outline: none;
            border-color: rgba(66, 165, 245, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        .add-website-btn {
            background: rgba(67, 160, 71, 0.2);
            border: 2px dashed rgba(67, 160, 71, 0.4);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 12px;
        }

        .add-website-btn:hover {
            background: rgba(67, 160, 71, 0.3);
            border-color: rgba(67, 160, 71, 0.6);
            color: #81c784;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-online {
            background: #43a047;
            box-shadow: 0 0 10px rgba(67, 160, 71, 0.5);
        }

        .status-offline {
            background: #e53935;
            box-shadow: 0 0 10px rgba(229, 57, 53, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .last-update {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9em;
            margin-top: 24px;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2.5em;
            }

            .card {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .ip-grid {
                grid-template-columns: 1fr;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #1e88e5, #1976d2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #42a5f5, #1e88e5);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ Server Control Dashboard</h1>
            <p>Manage your servers and quick access to IP addresses</p>
        </div>

        <div class="card">
            <h2>
                <span class="status-indicator" id="serverStatusIndicator"></span>
                Server Control
            </h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="getPCStatus()">🖥️ PC Status</button>
                <button id="startPCBtn" class="btn btn-success" onclick="startPC()">🚀 Start PC</button>
                <button id="shutdownPCBtn" class="btn btn-danger" onclick="shutdownPC()">🔴 Shutdown PC</button>
                <button class="btn btn-warning" onclick="restartServer()">🔄 Restart Bot</button>
                <button class="btn btn-primary" onclick="openTailscale()">🕸️ Tailscale Machines</button>
            </div>
        </div>

        <div class="card">
            <h2>🔌 Services & Ports</h2>
            <div id="servicesContainer" class="services-grid">
                <div class="loading-text">Loading services...</div>
            </div>
        </div>

        <div class="card">
            <div class="ip-header-actions">
                <h2>📋 Quick IP Access</h2>
                <button id="saveIPsBtn" class="save-ip-btn" onclick="saveIPAddresses()" style="display: none;">
                    💾 Save Changes
                </button>
            </div>
            <div id="ipAddressesContainer" class="ip-grid">
                <div class="loading-text">Loading IP addresses...</div>
            </div>
        </div>

        <div class="card">
            <div class="collapsible-header" onclick="toggleWebsites()">
                <h2>🌐 Websites & Links</h2>
                <span class="collapse-icon" id="websitesCollapseIcon">▼</span>
            </div>
            <div class="collapsible-content" id="websitesContent">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div></div>
                    <button id="saveWebsitesBtn" class="save-ip-btn" onclick="saveWebsites()" style="display: none;">
                        💾 Save Changes
                    </button>
                </div>
                <div id="websitesContainer">
                    <div class="loading-text">Loading websites...</div>
                </div>
            </div>
        </div>

        <div class="last-update" id="lastUpdate">
            Last updated: --
        </div>
    </div>

    <script>
        const socket = io();

        let ipAddresses = [];
        let ipAddressesModified = false;

        // Load IP addresses from API
        async function loadIPAddresses() {
            try {
                const response = await fetch('/api/ip-addresses');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Failed to load IP addresses');
                
                ipAddresses = data.ipAddresses || [];
                displayIPAddresses();
            } catch (error) {
                console.error('Error loading IP addresses:', error);
                document.getElementById('ipAddressesContainer').innerHTML = 
                    '<div class="loading-text">❌ Error loading IP addresses: ' + error.message + '</div>';
            }
        }

        // Display IP addresses
        function displayIPAddresses() {
            const container = document.getElementById('ipAddressesContainer');
            
            if (!ipAddresses || ipAddresses.length === 0) {
                container.innerHTML = '<div class="loading-text">No IP addresses configured</div>';
                return;
            }

            container.innerHTML = ipAddresses.map((ipEntry, index) => `
                <div class="ip-item" data-index="${index}">
                    <div class="ip-item-actions">
                        <button class="ip-action-btn" onclick="editIP(${index})" title="Edit">✏️</button>
                        <button class="ip-action-btn delete" onclick="deleteIP(${index})" title="Delete">🗑️</button>
                    </div>
                    <button class="copy-btn" onclick="copyIP(this.closest('.ip-item'))">Copy</button>
                    <div class="ip-label">${escapeHtml(ipEntry.label)}</div>
                    <div class="ip-address">${escapeHtml(ipEntry.ip)}</div>
                </div>
            `).join('') + `
                <div class="add-ip-btn" onclick="addNewIP()">
                    ➕ Add New IP Address
                </div>
            `;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy IP to clipboard
        function copyIP(element) {
            const ipAddress = element.querySelector('.ip-address').textContent;
            const copyBtn = element.querySelector('.copy-btn');
            
            navigator.clipboard.writeText(ipAddress).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✓ Copied';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy IP address');
            });
        }

        // Edit IP address
        function editIP(index) {
            const item = document.querySelector(`.ip-item[data-index="${index}"]`);
            if (!item) return;

            const ipEntry = ipAddresses[index];
            if (!ipEntry) return;

            item.classList.add('editing');
            item.innerHTML = `
                <div class="ip-item-actions">
                    <button class="ip-action-btn" onclick="saveIPEdit(${index})" title="Save">💾</button>
                    <button class="ip-action-btn delete" onclick="cancelIPEdit(${index})" title="Cancel">❌</button>
                </div>
                <input type="text" class="ip-label-input" value="${escapeHtml(ipEntry.label)}" placeholder="Label">
                <input type="text" class="ip-input" value="${escapeHtml(ipEntry.ip)}" placeholder="IP Address">
            `;
        }

        // Save IP edit
        function saveIPEdit(index) {
            const item = document.querySelector(`.ip-item[data-index="${index}"]`);
            if (!item) return;

            const labelInput = item.querySelector('.ip-label-input');
            const ipInput = item.querySelector('.ip-input');

            const newLabel = labelInput.value.trim();
            const newIP = ipInput.value.trim();

            if (!newLabel || !newIP) {
                alert('Both label and IP address are required');
                return;
            }

            // Basic IP validation
            const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (!ipRegex.test(newIP)) {
                alert('Please enter a valid IP address');
                return;
            }

            ipAddresses[index] = { label: newLabel, ip: newIP };
            ipAddressesModified = true;
            document.getElementById('saveIPsBtn').style.display = 'block';
            displayIPAddresses();
        }

        // Cancel IP edit
        function cancelIPEdit(index) {
            displayIPAddresses();
        }

        // Delete IP address
        function deleteIP(index) {
            if (!confirm(`Are you sure you want to delete "${ipAddresses[index].label}"?`)) {
                return;
            }

            ipAddresses.splice(index, 1);
            ipAddressesModified = true;
            document.getElementById('saveIPsBtn').style.display = 'block';
            displayIPAddresses();
        }

        // Add new IP address
        function addNewIP() {
            ipAddresses.push({ label: 'New Server', ip: '0.0.0.0' });
            ipAddressesModified = true;
            document.getElementById('saveIPsBtn').style.display = 'block';
            displayIPAddresses();
            editIP(ipAddresses.length - 1);
        }

        // Save IP addresses to server
        async function saveIPAddresses() {
            const saveBtn = document.getElementById('saveIPsBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '💾 Saving...';

            try {
                const response = await fetch('/api/ip-addresses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ipAddresses: ipAddresses })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save IP addresses');
                }

                const result = await response.json();
                if (result.success) {
                    ipAddressesModified = false;
                    saveBtn.style.display = 'none';
                    alert('✅ IP addresses saved successfully!');
                } else {
                    throw new Error(result.error || 'Failed to save');
                }
            } catch (error) {
                console.error('Error saving IP addresses:', error);
                alert('❌ Error saving IP addresses: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save Changes';
            }
        }

        // PC status function
        async function getPCStatus() {
            try {
                const response = await fetch('/api/pc/status');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const status = await response.json();
                const statusIcon = status.pcStatus === 'ONLINE' ? '✅' : '❌';

                alert(`🖥️ PC Status Check:\n\n` +
                    `${statusIcon} PC Status: ${status.pcStatus}\n` +
                    `🌐 PC IP: ${status.pcIP}\n` +
                    `🤖 Bot Status: ${status.botStatus}\n` +
                    `⏰ Checked: ${new Date(status.timestamp).toLocaleString()}`);

                updateServerIndicator(status.pcStatus === 'ONLINE');

            } catch (error) {
                alert('❌ Error checking PC status: ' + error.message);
                updateServerIndicator(false);
            }
        }

        // Update server status indicator
        function updateServerIndicator(isOnline) {
            const indicator = document.getElementById('serverStatusIndicator');
            indicator.className = 'status-indicator ' + (isOnline ? 'status-online' : 'status-offline');
        }

        // PC Control Functions
        async function startPC() {
            const startBtn = document.getElementById('startPCBtn');

            if (startBtn.disabled) return;

            updateButtonState(startBtn, 'loading', '⏳ Starting...', true);

            try {
                const response = await fetch('/api/pc/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();

                if (result.success) {
                    updateButtonState(startBtn, 'starting', '⏳ Starting...', true);

                    const startTimeout = setTimeout(() => {
                        if (startBtn.classList.contains('btn-loading')) {
                            updateButtonState(startBtn, 'error', '⏰ Start Timeout', false);
                            setTimeout(() => updatePCButtonStates(), 3000);
                        }
                    }, 120000);

                    startBtn.dataset.timeoutId = startTimeout;

                    [5000, 15000, 60000].forEach(delay => {
                        setTimeout(async () => {
                            await updatePCButtonStates();
                            if (!startBtn.classList.contains('btn-loading')) {
                                clearTimeout(startTimeout);
                            }
                        }, delay);
                    });

                } else {
                    const errorMsg = result.message || 'Start Failed';
                    updateButtonState(startBtn, 'error', `❌ ${errorMsg}`, false);
                    setTimeout(() => updatePCButtonStates(), 3000);
                }

            } catch (error) {
                console.error('Error starting PC:', error);
                let errorMsg = 'Start Failed';
                if (error.message.includes('Failed to fetch')) errorMsg = 'Network Error';
                else if (error.message.includes('timeout')) errorMsg = 'Request Timeout';

                updateButtonState(startBtn, 'error', `❌ ${errorMsg}`, false);
                setTimeout(() => updatePCButtonStates(), 3000);
            }
        }

        async function shutdownPC() {
            const shutdownBtn = document.getElementById('shutdownPCBtn');

            if (shutdownBtn.disabled) return;

            if (!confirm('🔴 Are you sure you want to shutdown the PC?\n\nThis will power off the PC completely.')) {
                return;
            }

            updateButtonState(shutdownBtn, 'loading', '⏳ Shutting Down...', true);

            try {
                const response = await fetch('/api/pc/shutdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();

                if (result.success) {
                    updateButtonState(shutdownBtn, 'shutting-down', '⏳ Shutting Down...', true);

                    const shutdownTimeout = setTimeout(() => {
                        if (shutdownBtn.classList.contains('btn-loading')) {
                            updateButtonState(shutdownBtn, 'error', '⏰ Shutdown Timeout', false);
                            setTimeout(() => updatePCButtonStates(), 3000);
                        }
                    }, 90000);

                    shutdownBtn.dataset.timeoutId = shutdownTimeout;

                    [10000, 20000, 60000].forEach(delay => {
                        setTimeout(async () => {
                            await updatePCButtonStates();
                            if (!shutdownBtn.classList.contains('btn-loading')) {
                                clearTimeout(shutdownTimeout);
                            }
                        }, delay);
                    });

                } else {
                    const errorMsg = result.message || 'Shutdown Failed';
                    updateButtonState(shutdownBtn, 'error', `❌ ${errorMsg}`, false);
                    setTimeout(() => updatePCButtonStates(), 3000);
                }

            } catch (error) {
                console.error('Error shutting down PC:', error);
                let errorMsg = 'Shutdown Failed';
                if (error.message.includes('Failed to fetch')) errorMsg = 'Network Error';
                else if (error.message.includes('timeout')) errorMsg = 'Request Timeout';

                updateButtonState(shutdownBtn, 'error', `❌ ${errorMsg}`, false);
                setTimeout(() => updatePCButtonStates(), 3000);
            }
        }

        // Button state management
        function updateButtonState(button, state, text, disabled) {
            button.textContent = text;
            button.disabled = disabled;

            button.classList.remove('btn-loading', 'btn-success', 'btn-danger', 'btn-warning', 'btn-primary');

            switch (state) {
                case 'loading':
                case 'starting':
                case 'shutting-down':
                    button.classList.add('btn-loading', 'btn-warning');
                    break;
                case 'error':
                    button.classList.add('btn-danger');
                    break;
                default:
                    if (button.id === 'startPCBtn') {
                        button.classList.add('btn-success');
                    } else if (button.id === 'shutdownPCBtn') {
                        button.classList.add('btn-danger');
                    }
            }
        }

        // Update PC button states
        async function updatePCButtonStates() {
            try {
                const response = await fetch('/api/pc/status');
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const status = await response.json();
                const startBtn = document.getElementById('startPCBtn');
                const shutdownBtn = document.getElementById('shutdownPCBtn');

                if (status.pcStatus === 'ONLINE') {
                    updateButtonState(startBtn, 'online', '✅ PC Online', true);
                    updateButtonState(shutdownBtn, 'default', '🔴 Shutdown PC', false);
                    updateServerIndicator(true);
                } else {
                    updateButtonState(startBtn, 'default', '🚀 Start PC', false);
                    updateButtonState(shutdownBtn, 'offline', '⚫ PC Offline', true);
                    updateServerIndicator(false);
                }

                document.getElementById('lastUpdate').textContent = 
                    'Last updated: ' + new Date().toLocaleString();

            } catch (error) {
                console.error('Error checking PC status:', error);
                const startBtn = document.getElementById('startPCBtn');
                const shutdownBtn = document.getElementById('shutdownPCBtn');
                updateButtonState(startBtn, 'default', '🚀 Start PC', false);
                updateButtonState(shutdownBtn, 'default', '🔴 Shutdown PC', false);
                updateServerIndicator(false);
            }
        }

        async function restartServer() {
            if (!confirm('🔄 Are you sure you want to restart the Discord bot?\n\nThis will temporarily disconnect the bot from Discord.')) {
                return;
            }

            try {
                const response = await fetch('/api/server/restart', { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    alert('✅ Bot restart initiated!\n\nThe bot will restart in a few seconds.');
                } else {
                    alert('❌ Error restarting server: ' + result.message);
                }
            } catch (error) {
                alert('❌ Error restarting server: ' + error.message);
            }
        }

        function openTailscale() {
            window.open('/tailscale', '_blank');
        }

        // Socket events
        socket.on('pcStatusUpdate', (data) => {
            console.log('PC status update received:', data);
            const startBtn = document.getElementById('startPCBtn');
            const shutdownBtn = document.getElementById('shutdownPCBtn');

            if (data.pcStatus === 'ONLINE') {
                updateButtonState(startBtn, 'online', '✅ PC Online', true);
                updateButtonState(shutdownBtn, 'default', '🔴 Shutdown PC', false);
                updateServerIndicator(true);
            } else {
                updateButtonState(startBtn, 'default', '🚀 Start PC', false);
                updateButtonState(shutdownBtn, 'offline', '⚫ PC Offline', true);
                updateServerIndicator(false);
            }
        });

        // Load and display services
        async function loadServices() {
            try {
                const response = await fetch('/api/services');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Failed to load services');
                
                displayServices(data.services);
            } catch (error) {
                console.error('Error loading services:', error);
                document.getElementById('servicesContainer').innerHTML = 
                    '<div class="loading-text">❌ Error loading services: ' + error.message + '</div>';
            }
        }

        function displayServices(services) {
            const container = document.getElementById('servicesContainer');
            
            if (!services || services.length === 0) {
                container.innerHTML = '<div class="loading-text">No services configured</div>';
                return;
            }

            container.innerHTML = services.map(service => `
                <div class="service-item">
                    <div class="service-header">
                        <div>
                            <div class="service-name">${service.name}</div>
                        </div>
                        <span class="service-location">${service.location}</span>
                    </div>
                    ${service.description ? `<div class="service-description">${service.description}</div>` : ''}
                    <div class="service-details">
                        <div class="service-detail-row">
                            <span class="service-detail-label">Host:</span>
                            <span class="service-detail-value">${service.host}</span>
                        </div>
                        <div class="service-detail-row">
                            <span class="service-detail-label">Port:</span>
                            <span class="service-detail-value">${service.port}</span>
                        </div>
                        <div class="service-detail-row">
                            <span class="service-detail-label">Protocol:</span>
                            <span class="service-detail-value">${service.protocol.toUpperCase()}</span>
                        </div>
                    </div>
                    <div class="service-url">
                        <a href="${service.url}" target="_blank" class="service-url-btn">
                            🔗 Open ${service.name}
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Websites management
        let websites = [];
        let websitesModified = false;
        let websitesExpanded = true;

        function toggleWebsites() {
            websitesExpanded = !websitesExpanded;
            const content = document.getElementById('websitesContent');
            const icon = document.getElementById('websitesCollapseIcon');
            
            if (websitesExpanded) {
                content.classList.remove('collapsed');
                icon.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                icon.classList.add('collapsed');
            }
        }

        // Load websites from API
        async function loadWebsites() {
            try {
                const response = await fetch('/api/websites');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Failed to load websites');
                
                websites = data.websites || [];
                displayWebsites();
            } catch (error) {
                console.error('Error loading websites:', error);
                document.getElementById('websitesContainer').innerHTML = 
                    '<div class="loading-text">❌ Error loading websites: ' + error.message + '</div>';
            }
        }

        // Display websites
        function displayWebsites() {
            const container = document.getElementById('websitesContainer');
            
            if (!websites || websites.length === 0) {
                container.innerHTML = '<div class="loading-text">No websites configured</div>';
                return;
            }

            container.innerHTML = websites.map((website, index) => `
                <div class="website-item" data-index="${index}">
                    <div class="website-item-actions">
                        <button class="ip-action-btn" onclick="editWebsite(${index})" title="Edit">✏️</button>
                        <button class="ip-action-btn delete" onclick="deleteWebsite(${index})" title="Delete">🗑️</button>
                    </div>
                    <a href="${escapeHtml(website.url)}" target="_blank" class="website-link">
                        ${escapeHtml(website.name)}
                    </a>
                    ${website.description ? `<div class="website-description">${escapeHtml(website.description)}</div>` : ''}
                </div>
            `).join('') + `
                <div class="add-website-btn" onclick="addNewWebsite()">
                    ➕ Add New Website
                </div>
            `;
        }

        // Edit website
        function editWebsite(index) {
            const item = document.querySelector(`.website-item[data-index="${index}"]`);
            if (!item) return;

            const website = websites[index];
            if (!website) return;

            item.classList.add('editing');
            item.innerHTML = `
                <div class="website-item-actions">
                    <button class="ip-action-btn" onclick="saveWebsiteEdit(${index})" title="Save">💾</button>
                    <button class="ip-action-btn delete" onclick="cancelWebsiteEdit(${index})" title="Cancel">❌</button>
                </div>
                <input type="text" class="website-name-input" value="${escapeHtml(website.name)}" placeholder="Website Name">
                <input type="text" class="website-url-input" value="${escapeHtml(website.url)}" placeholder="URL (https://...)">
                <input type="text" class="website-desc-input" value="${escapeHtml(website.description || '')}" placeholder="Description (optional)">
            `;
        }

        // Save website edit
        function saveWebsiteEdit(index) {
            const item = document.querySelector(`.website-item[data-index="${index}"]`);
            if (!item) return;

            const nameInput = item.querySelector('.website-name-input');
            const urlInput = item.querySelector('.website-url-input');
            const descInput = item.querySelector('.website-desc-input');

            const newName = nameInput.value.trim();
            const newURL = urlInput.value.trim();
            const newDesc = descInput.value.trim();

            if (!newName || !newURL) {
                alert('Both name and URL are required');
                return;
            }

            // Basic URL validation
            try {
                new URL(newURL);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }

            websites[index] = { 
                name: newName, 
                url: newURL,
                description: newDesc || undefined
            };
            websitesModified = true;
            document.getElementById('saveWebsitesBtn').style.display = 'block';
            displayWebsites();
        }

        // Cancel website edit
        function cancelWebsiteEdit(index) {
            displayWebsites();
        }

        // Delete website
        function deleteWebsite(index) {
            if (!confirm(`Are you sure you want to delete "${websites[index].name}"?`)) {
                return;
            }

            websites.splice(index, 1);
            websitesModified = true;
            document.getElementById('saveWebsitesBtn').style.display = 'block';
            displayWebsites();
        }

        // Add new website
        function addNewWebsite() {
            websites.push({ name: 'New Website', url: 'https://example.com', description: '' });
            websitesModified = true;
            document.getElementById('saveWebsitesBtn').style.display = 'block';
            displayWebsites();
            editWebsite(websites.length - 1);
        }

        // Save websites to server
        async function saveWebsites() {
            const saveBtn = document.getElementById('saveWebsitesBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '💾 Saving...';

            try {
                const response = await fetch('/api/websites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ websites: websites })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save websites');
                }

                const result = await response.json();
                if (result.success) {
                    websitesModified = false;
                    saveBtn.style.display = 'none';
                    alert('✅ Websites saved successfully!');
                } else {
                    throw new Error(result.error || 'Failed to save');
                }
            } catch (error) {
                console.error('Error saving websites:', error);
                alert('❌ Error saving websites: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save Changes';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            updatePCButtonStates();
            loadServices();
            loadIPAddresses();
            loadWebsites();
            setInterval(updatePCButtonStates, 30000); // Update every 30 seconds
            setInterval(loadServices, 60000); // Refresh services every minute
        });
    </script>
</body>

</html>
