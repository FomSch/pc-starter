<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Temperature Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: aurora 20s ease-in-out infinite;
        }
        
        @keyframes aurora {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 32px 64px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a8edea 50%, #fed6e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }
        
        .header p {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 32px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .status-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .status-card:hover::before {
            left: 100%;
        }
        
        .status-card h3 {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95em;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .status-value {
            font-size: 2.8em;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }
        
        .temp-critical { 
            border-left: 4px solid #ff6b6b;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(255, 107, 107, 0.05));
        }
        .temp-hot { 
            border-left: 4px solid #ffa726;
            background: linear-gradient(135deg, rgba(255, 167, 38, 0.1), rgba(255, 167, 38, 0.05));
        }
        .temp-warm { 
            border-left: 4px solid #ffee58;
            background: linear-gradient(135deg, rgba(255, 238, 88, 0.1), rgba(255, 238, 88, 0.05));
        }
        .temp-normal { 
            border-left: 4px solid #66bb6a;
            background: linear-gradient(135deg, rgba(102, 187, 106, 0.1), rgba(102, 187, 106, 0.05));
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary.active {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #56ab2f, #a8e6cf);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(86, 171, 47, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        
        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-loading {
            position: relative;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .control-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-section h4 {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .chart-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }
        
        .stats-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stats-container h3 {
            margin-bottom: 24px;
            text-align: center;
            font-size: 1.5em;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 24px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .stat-item:hover::before {
            transform: scaleX(1);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .last-update {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-top: 24px;
            font-weight: 300;
        }
        
        /* Floating particles animation */
        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(1px 1px at 40px 70px, rgba(255, 255, 255, 0.1), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255, 255, 255, 0.1), transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(1px 1px at 160px 30px, rgba(255, 255, 255, 0.1), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: float 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-10px) translateX(10px); }
            66% { transform: translateY(5px) translateX(-5px); }
            100% { transform: translateY(0px) translateX(0px); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 24px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2.5em;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                gap: 12px;
            }
            
            .btn {
                width: 100%;
                min-width: auto;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Pi Temperature Dashboard</h1>
            <p>Real-time monitoring and historical data</p>
        </div>
        
        <div class="status-grid">
            <div class="status-card" id="currentTemp">
                <h3>Current Temperature</h3>
                <div class="status-value">--°C</div>
            </div>
            <div class="status-card">
                <h3>CPU Load</h3>
                <div class="status-value" id="cpuLoad">--%</div>
            </div>
            <div class="status-card">
                <h3>Memory Usage</h3>
                <div class="status-value" id="memUsage">--%</div>
            </div>
            <div class="status-card">
                <h3>Status</h3>
                <div class="status-value" id="systemStatus">--</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary active" onclick="loadData(1)">1 Hour</button>
            <button class="btn btn-primary" onclick="loadData(6)">6 Hours</button>
            <button class="btn btn-primary" onclick="loadData(24)">24 Hours</button>
            <button class="btn btn-primary" onclick="loadData(168)">7 Days</button>
            <button class="btn btn-primary" onclick="loadData(720)">30 Days</button>
            <button class="btn btn-secondary" onclick="exportData()">Export CSV</button>
        </div>
        
        <div class="control-section">
            <h4>🖥️ Server Control</h4>
            <div class="controls">
                <button class="btn btn-secondary" onclick="getPCStatus()">🖥️ PC Status</button>
                <button id="startPCBtn" class="btn btn-success" onclick="startPC()">🚀 Start PC</button>
                <button id="shutdownPCBtn" class="btn btn-danger" onclick="shutdownPC()">🔴 Shutdown PC</button>
                <button class="btn btn-warning" onclick="restartServer()">🔄 Restart Bot</button>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>
        
        <div class="stats-container">
            <h3>📊 Statistics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Min Temperature</div>
                    <div class="stat-value" id="minTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Max Temperature</div>
                    <div class="stat-value" id="maxTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Average Temperature</div>
                    <div class="stat-value" id="avgTemp">--°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Data Points</div>
                    <div class="stat-value" id="dataCount">--</div>
                </div>
            </div>
        </div>
        
        <div class="last-update" id="lastUpdate">
            Last updated: --
        </div>
    </div>

    <script>
        const socket = io();
        let chart;
        let currentHours = 1;
        
        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('temperatureChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: [],
                        borderColor: '#4facfe',
                        backgroundColor: 'rgba(79, 172, 254, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#4facfe',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#ffffff',
                                font: {
                                    size: 14,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: '#4facfe',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Temperature (°C)',
                                color: '#ffffff',
                                font: {
                                    size: 14,
                                    weight: '500'
                                }
                            },
                            ticks: {
                                color: '#ffffff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time',
                                color: '#ffffff',
                                font: {
                                    size: 14,
                                    weight: '500'
                                }
                            },
                            ticks: {
                                color: '#ffffff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }
        
        // Load temperature data
        async function loadData(hours) {
            currentHours = hours;
            
            // Update active button
            document.querySelectorAll('.btn-primary').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            try {
                const response = await fetch(`/api/temperature/${hours}`);
                const data = await response.json();
                
                const labels = data.map(item => {
                    const date = new Date(item.timestamp);
                    return hours <= 24 ? 
                        date.toLocaleTimeString() : 
                        date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                });
                
                const temperatures = data.map(item => item.temperature);
                
                chart.data.labels = labels;
                chart.data.datasets[0].data = temperatures;
                chart.update();
                
                // Load stats
                loadStats(hours);
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        // Load statistics
        async function loadStats(hours) {
            try {
                const response = await fetch(`/api/stats/${hours}`);
                const stats = await response.json();
                
                document.getElementById('minTemp').textContent = stats.min_temp ? stats.min_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('maxTemp').textContent = stats.max_temp ? stats.max_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('avgTemp').textContent = stats.avg_temp ? stats.avg_temp.toFixed(1) + '°C' : '--°C';
                document.getElementById('dataCount').textContent = stats.count || '--';
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load current data
        async function loadCurrentData() {
            try {
                const response = await fetch('/api/current');
                const data = await response.json();
                
                updateCurrentDisplay(data);
                
            } catch (error) {
                console.error('Error loading current data:', error);
            }
        }
        
        // Update current display
        function updateCurrentDisplay(data) {
            const tempCard = document.getElementById('currentTemp');
            const tempValue = tempCard.querySelector('.status-value');
            
            if (data.temperature !== null) {
                tempValue.textContent = data.temperature.toFixed(1) + '°C ' + data.emoji;
                
                // Update card color based on temperature
                tempCard.className = 'status-card';
                if (data.temperature >= 80) tempCard.classList.add('temp-critical');
                else if (data.temperature >= 70) tempCard.classList.add('temp-hot');
                else if (data.temperature >= 60) tempCard.classList.add('temp-warm');
                else tempCard.classList.add('temp-normal');
            } else {
                tempValue.textContent = 'N/A';
            }
            
            // Update system stats
            if (data.systemStats) {
                document.getElementById('cpuLoad').textContent = 
                    data.systemStats.cpuLoad !== undefined ? data.systemStats.cpuLoad + '%' : '--%';
                document.getElementById('memUsage').textContent = 
                    data.systemStats.memUsage !== undefined ? data.systemStats.memUsage + '%' : '--%';
            }
            
            document.getElementById('systemStatus').textContent = data.status || '--';
            document.getElementById('lastUpdate').textContent = 
                'Last updated: ' + new Date(data.timestamp).toLocaleString();
        }
        
        // Export data
        function exportData() {
            window.open(`/api/export/${currentHours}`, '_blank');
        }
        
        // PC status function (same logic as Discord bot)
        async function getPCStatus() {
            try {
                const response = await fetch('/api/pc/status');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const status = await response.json();
                
                const statusIcon = status.pcStatus === 'ONLINE' ? '✅' : '❌';
                
                alert(`🖥️ PC Status Check:\n\n` +
                      `${statusIcon} PC Status: ${status.pcStatus}\n` +
                      `🌐 PC IP: ${status.pcIP}\n` +
                      `🤖 Bot Status: ${status.botStatus}\n` +
                      `⏰ Checked: ${new Date(status.timestamp).toLocaleString()}`);
                      
            } catch (error) {
                alert('❌ Error checking PC status: ' + error.message);
            }
        }
        
        // PC Control Functions
        async function startPC() {
            const startBtn = document.getElementById('startPCBtn');
            
            // Prevent multiple clicks
            if (startBtn.disabled) {
                return;
            }
            
            // Set loading state with immediate feedback
            updateButtonState(startBtn, 'loading', '⏳ Starting...', true);
            
            try {
                const response = await fetch('/api/pc/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    // Update to starting state as per requirement 2.4
                    updateButtonState(startBtn, 'starting', '⏳ Starting...', true);
                    
                    // Set up timeout for starting operation (2 minutes)
                    const startTimeout = setTimeout(() => {
                        // Check if still in starting state
                        if (startBtn.classList.contains('btn-loading')) {
                            updateButtonState(startBtn, 'error', '⏰ Start Timeout', false);
